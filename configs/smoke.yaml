seed: 1234
device: auto
system:
  n_rx: 4
  n_layers: 3
  n_subcarriers: 12
  n_symbols: 7
  dmrs_symbols: [1, 5]
  bits_per_symbol: 4
  snr_db_min: 8.0
  snr_db_max: 12.0
  channel_true_rank: 10
  channel_length_f: 4.0
  channel_length_t: 1.8
model:
  rank: 8
  detector_iterations: 2
  edge_mass: 0.90
  use_uncertainty: true
training:
  batch_size: 8
  steps: 4
  lr: 0.003
  log_every: 1
  save_every: 2
  channel_loss_weight: 0.05
  grad_clip: 1.0
evaluation:
  snr_grid_db: [6.0, 10.0]
  batches_per_snr: 2
  batch_size: 16
  baselines: [ls, bayesroute_mean, bayesroute_uncertainty, oracle]
