[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesroute-rx-twc"
version = "0.2.0"
description = "BayesRoute-Rx Gate-0 v2 principle-validation implementation"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "optuna>=3.6",
  "scikit-learn>=1.4"
]

[tool.setuptools.packages.find]
where = ["src"]
